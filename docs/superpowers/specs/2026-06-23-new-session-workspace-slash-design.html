<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新会话空态 + 工作区 + / 指令面板 设计原型 v3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-[#F7F8FA] text-[#111827] min-h-screen">
  <div class="max-w-5xl mx-auto p-8 space-y-12">
    <div>
      <h1 class="text-2xl font-bold mb-1">设计原型 v3</h1>
      <p class="text-gray-500 text-sm">去掉分类和子功能，简化空态</p>
    </div>

    <!-- 图1 新会话空态 -->
    <section class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
      <div class="px-6 py-3 border-b border-gray-100 bg-gray-50/50">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">图1 · 新会话空态</span>
      </div>
      
      <div class="flex flex-col min-h-[520px]">
        <div class="flex-1 flex flex-col items-center justify-center px-6 py-12">
          <div class="w-full max-w-[680px]">
            <!-- 标题：左对齐 -->
            <div class="mb-10 text-left">
              <h1 class="text-4xl font-bold text-[#111827] leading-tight">PI Agent</h1>
              <p class="text-2xl font-semibold text-[#111827] mt-1">你的职场超能力</p>
            </div>

            <!-- 输入框：复用现有 InputArea 样式 -->
            <div class="rounded-[12px] border-2 border-gray-200 bg-white focus-within:border-[#7c3aed] transition-all shadow-sm">
              <textarea 
                class="w-full resize-none bg-transparent px-4 pt-3 pb-1 text-sm leading-relaxed text-[#111827] placeholder-gray-400 outline-none"
                rows="1"
                placeholder="今天帮你做些什么？@ 引用对话文件，/ 调用技能与指令"
              ></textarea>
              
              <!-- 底部工具栏：与现有 InputArea 一致 -->
              <div class="flex items-center justify-between gap-2 px-4 pb-3">
                <div class="flex items-center gap-2 min-w-0">
                  <button class="inline-flex size-7 shrink-0 items-center justify-center rounded-md text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                  </button>
                  <span class="hidden text-xs text-gray-400 sm:inline">/ 唤起指令面板</span>
                </div>
                
                <span class="hidden text-xs text-gray-400 md:inline">Enter 发送 · Shift+Enter 换行</span>
                
                <div class="flex items-center gap-2">
                  <button class="flex items-center gap-1 px-2 py-1 text-xs text-gray-600 hover:bg-gray-100 rounded border border-gray-200">
                    Kimi-K2.7-Code
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                  </button>
                  <button class="rounded-full size-8 bg-[#7c3aed] text-white hover:bg-[#7c3aed]/90 flex items-center justify-center disabled:opacity-50" disabled>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"></path></svg>
                  </button>
                </div>
              </div>
            </div>

            <!-- 工作区选择 -->
            <div class="mt-3">
              <button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs text-gray-500 hover:text-gray-800 bg-gray-50 hover:bg-gray-100 rounded-lg transition">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                选择工作区
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 图2 / 指令面板 -->
    <section class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
      <div class="px-6 py-3 border-b border-gray-100 bg-gray-50/50">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">图2 · / 指令面板</span>
      </div>
      
      <div class="p-8">
        <div class="max-w-xl mx-auto">
          <div class="rounded-[12px] border-2 border-[#7c3aed] bg-white p-4 mb-2">
            <div class="text-sm text-[#111827]">/</div>
          </div>
          
          <div class="rounded-xl border border-gray-200 bg-white shadow-lg overflow-hidden">
            <div class="px-3 py-2.5 border-b border-gray-100 bg-gray-50/50">
              <div class="flex items-center gap-2 text-xs text-gray-500">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                输入搜索...
              </div>
            </div>
            <div class="max-h-[320px] overflow-auto py-2">
              <div class="px-3 py-1 text-xs font-semibold text-gray-400 uppercase tracking-wide">命令</div>
              <button class="w-full flex items-start gap-3 px-3 py-2.5 hover:bg-gray-50 text-left group">
                <svg class="w-4 h-4 text-[#7c3aed] mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <div>
                  <div class="text-sm font-medium text-gray-900">Spec</div>
                  <div class="text-xs text-gray-500">根据需求细化完整的规范、任务、验收文档，用户确认后再严格执行</div>
                </div>
              </button>
              <button class="w-full flex items-start gap-3 px-3 py-2.5 hover:bg-gray-50 text-left group">
                <svg class="w-4 h-4 text-[#7c3aed] mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6 4h6a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg>
                <div>
                  <div class="text-sm font-medium text-gray-900">Plan</div>
                  <div class="text-xs text-gray-500">优先规划任务的执行方向，用户确认后再执行</div>
                </div>
              </button>
              
              <div class="px-3 py-1 mt-2 text-xs font-semibold text-gray-400 uppercase tracking-wide">技能</div>
              <button class="w-full flex items-start gap-3 px-3 py-2.5 bg-gray-50 text-left group">
                <svg class="w-4 h-4 text-gray-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <div>
                  <div class="text-sm font-medium text-gray-900">agent-browser</div>
                  <div class="text-xs text-gray-500">为 AI Agent 提供浏览器自动化 CLI，支持页面导航、表单填写、按钮点击等</div>
                </div>
              </button>
              <button class="w-full flex items-start gap-3 px-3 py-2.5 hover:bg-gray-50 text-left group">
                <svg class="w-4 h-4 text-gray-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                <div>
                  <div class="text-sm font-medium text-gray-900">brainstorming</div>
                  <div class="text-xs text-gray-500">在任何创作、功能开发或行为修改前，先探索用户意图、需求和设计方向</div>
                </div>
              </button>
            </div>
            <div class="flex items-center justify-between px-4 py-2 border-t border-gray-100 bg-gray-50/50 text-xs text-gray-500">
              <div class="flex items-center gap-3">
                <span>↑↓ 导航</span>
                <span>↵ 选择</span>
                <span>ESC 关闭</span>
              </div>
              <span>5 个指令</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
