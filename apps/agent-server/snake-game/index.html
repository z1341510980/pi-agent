<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10131a;
      --panel: #181d26;
      --line: #2a3242;
      --text: #eef2f7;
      --muted: #9aa7b8;
      --snake: #3ddc84;
      --snake-head: #76f7ad;
      --food: #ff5c7a;
      --accent: #f5c542;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(61, 220, 132, 0.14), transparent 30rem),
        radial-gradient(circle at bottom right, rgba(245, 197, 66, 0.12), transparent 28rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(94vw, 720px);
      display: grid;
      gap: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat {
      min-width: 96px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(24, 29, 38, 0.86);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .stat strong {
      display: block;
      margin-top: 2px;
      font-size: 20px;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .game-shell {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #0c1016;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.34);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(12, 16, 22, 0.72);
      backdrop-filter: blur(5px);
      text-align: center;
    }

    .overlay.hidden { display: none; }

    .message {
      max-width: 420px;
      display: grid;
      gap: 14px;
    }

    .message h2 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .message p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    button {
      justify-self: center;
      min-width: 132px;
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      background: var(--snake);
      color: #07100b;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover { background: var(--snake-head); }
    button:focus-visible { outline: 3px solid rgba(245, 197, 66, 0.78); outline-offset: 3px; }

    .controls {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      flex-wrap: wrap;
    }

    .mobile-pad {
      display: none;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 48px);
      gap: 8px;
      justify-content: center;
    }

    .mobile-pad button {
      min-width: 0;
      width: 56px;
      height: 48px;
      padding: 0;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      font-size: 20px;
    }

    .mobile-pad [data-dir="up"] { grid-column: 2; }
    .mobile-pad [data-dir="left"] { grid-column: 1; grid-row: 2; }
    .mobile-pad [data-dir="down"] { grid-column: 2; grid-row: 2; }
    .mobile-pad [data-dir="right"] { grid-column: 3; grid-row: 2; }

    @media (max-width: 640px) {
      body { align-items: start; padding: 14px 0; }
      main { gap: 12px; }
      h1 { font-size: 24px; }
      .stat { flex: 1; min-width: 0; }
      .controls { justify-content: center; text-align: center; }
      .mobile-pad { display: grid; }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <h1>贪吃蛇</h1>
      <div class="stats" aria-label="游戏数据">
        <div class="stat"><span>分数</span><strong id="score">0</strong></div>
        <div class="stat"><span>最高分</span><strong id="best">0</strong></div>
      </div>
    </div>

    <section class="game-shell" aria-label="贪吃蛇游戏区域">
      <canvas id="board" width="600" height="600"></canvas>
      <div class="overlay" id="overlay">
        <div class="message">
          <h2 id="messageTitle">准备开始</h2>
          <p id="messageText">方向键或 WASD 控制移动，空格暂停。</p>
          <button id="startButton" type="button">开始游戏</button>
        </div>
      </div>
    </section>

    <div class="controls">
      <span>方向键 / WASD 移动，空格暂停，Enter 重新开始</span>
      <span>吃到食物会加速</span>
    </div>

    <div class="mobile-pad" aria-label="移动端方向控制">
      <button type="button" data-dir="up" aria-label="向上">↑</button>
      <button type="button" data-dir="left" aria-label="向左">←</button>
      <button type="button" data-dir="down" aria-label="向下">↓</button>
      <button type="button" data-dir="right" aria-label="向右">→</button>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const messageTitle = document.getElementById('messageTitle');
    const messageText = document.getElementById('messageText');
    const startButton = document.getElementById('startButton');

    const grid = 24;
    const cell = canvas.width / grid;
    const storageKey = 'snake-best-score';
    let best = Number(localStorage.getItem(storageKey) || 0);
    let snake;
    let food;
    let direction;
    let nextDirection;
    let score;
    let speed;
    let timer;
    let running = false;
    let paused = false;

    bestEl.textContent = best;

    function resetGame() {
      snake = [
        { x: 11, y: 12 },
        { x: 10, y: 12 },
        { x: 9, y: 12 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      speed = 130;
      paused = false;
      scoreEl.textContent = score;
      placeFood();
      draw();
    }

    function startGame() {
      resetGame();
      running = true;
      overlay.classList.add('hidden');
      clearTimeout(timer);
      loop();
    }

    function loop() {
      timer = setTimeout(() => {
        if (running && !paused) update();
        if (running) loop();
      }, speed);
    }

    function update() {
      direction = nextDirection;
      const head = snake[0];
      const next = { x: head.x + direction.x, y: head.y + direction.y };

      if (hitWall(next) || hitSnake(next)) {
        endGame();
        return;
      }

      snake.unshift(next);

      if (next.x === food.x && next.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        speed = Math.max(62, speed - 4);
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function hitWall(part) {
      return part.x < 0 || part.x >= grid || part.y < 0 || part.y >= grid;
    }

    function hitSnake(part) {
      return snake.some(segment => segment.x === part.x && segment.y === part.y);
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * grid),
          y: Math.floor(Math.random() * grid)
        };
      } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
    }

    function endGame() {
      running = false;
      clearTimeout(timer);
      if (score > best) {
        best = score;
        localStorage.setItem(storageKey, String(best));
        bestEl.textContent = best;
      }
      messageTitle.textContent = '游戏结束';
      messageText.textContent = `本局得分 ${score}。按 Enter 或点击按钮再来一局。`;
      startButton.textContent = '重新开始';
      overlay.classList.remove('hidden');
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      if (paused) {
        messageTitle.textContent = '已暂停';
        messageText.textContent = '按空格继续。';
        startButton.textContent = '继续';
        overlay.classList.remove('hidden');
      } else {
        overlay.classList.add('hidden');
      }
    }

    function setDirection(dir) {
      const map = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };
      const wanted = map[dir];
      if (!wanted) return;
      if (wanted.x + direction.x === 0 && wanted.y + direction.y === 0) return;
      nextDirection = wanted;
    }

    function draw() {
      ctx.fillStyle = '#0c1016';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.045)';
      ctx.lineWidth = 1;
      for (let i = 1; i < grid; i++) {
        const p = i * cell;
        ctx.beginPath();
        ctx.moveTo(p, 0);
        ctx.lineTo(p, canvas.height);
        ctx.moveTo(0, p);
        ctx.lineTo(canvas.width, p);
        ctx.stroke();
      }

      drawFood();
      snake.forEach((segment, index) => drawSnakePart(segment, index));
    }

    function drawSnakePart(segment, index) {
      const inset = index === 0 ? 3 : 4;
      const radius = 7;
      const x = segment.x * cell + inset;
      const y = segment.y * cell + inset;
      const size = cell - inset * 2;
      ctx.fillStyle = index === 0 ? '#76f7ad' : '#3ddc84';
      roundRect(x, y, size, size, radius);
      ctx.fill();
    }

    function drawFood() {
      const cx = food.x * cell + cell / 2;
      const cy = food.y * cell + cell / 2;
      ctx.fillStyle = '#ff5c7a';
      ctx.beginPath();
      ctx.arc(cx, cy, cell * 0.34, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.beginPath();
      ctx.arc(cx - cell * 0.1, cy - cell * 0.12, cell * 0.09, 0, Math.PI * 2);
      ctx.fill();
    }

    function roundRect(x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
    }

    document.addEventListener('keydown', event => {
      const keys = {
        ArrowUp: 'up', KeyW: 'up',
        ArrowDown: 'down', KeyS: 'down',
        ArrowLeft: 'left', KeyA: 'left',
        ArrowRight: 'right', KeyD: 'right'
      };

      if (keys[event.code]) {
        event.preventDefault();
        setDirection(keys[event.code]);
      }

      if (event.code === 'Space') {
        event.preventDefault();
        togglePause();
      }

      if (event.code === 'Enter') {
        event.preventDefault();
        if (!running) startGame();
      }
    });

    document.querySelectorAll('.mobile-pad button').forEach(button => {
      button.addEventListener('click', () => setDirection(button.dataset.dir));
    });

    startButton.addEventListener('click', () => {
      if (running && paused) {
        togglePause();
      } else {
        startGame();
      }
    });

    resetGame();
  </script>
</body>
</html>
