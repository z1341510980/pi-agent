appId: com.wenlang-agent.app
productName: Wenlang Agent
directories:
  buildResources: build
# electron-vite 已将 main/preload/renderer 全部 bundle 到 out/，
# 运行时不需要 node_modules（原生模块通过 extraResources + asarUnpack 处理）。
# 用白名单模式避免 electron-builder 扫描 pnpm 全量 node_modules（极慢）。
# resources/ 必须随包：tray.ts / index.ts 的 ?asset 引用编译为
# path.join(__dirname, '../../resources/icon.png')，不打进 asar 则托盘/窗口图标缺失
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
# 后端 bytenode 字节码 + 原生模块，不进 asar 便于直接 require
# electron-builder 的 createFilter 硬编码排除根 node_modules（filter.js#L43），
# 需要单独添加一条 extraResources 来复制 node_modules 目录
extraResources:
  - from: ../agent-server/dist
    to: server
    filter: ['**/*', '!**/*.map', '!node_modules/**']
  - from: ../agent-server/dist/node_modules
    to: server/node_modules
win:
  executableName: wenlang-agent
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  # 向导式安装：提供安装目录选择（默认 oneClick 一键安装无任何选项）
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
# beforeBuild 返回 false → areNodeModulesHandledExternally = true
# 跳过 node module collector（pnpm store 全量扫描极慢/卡死）
beforeBuild: build/beforeBuild.js
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
