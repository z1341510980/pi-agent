/* ── Shared Atoms ───────────────────────────────────────────── */

  width: var(--icon-size-16);
  height: var(--icon-size-16);
}

.icon-img {
  width: 16px;
  height: 16px;
  flex-basis: 16px;
}

.mono,
.num,
code,
kbd,
samp,
pre {
  font-family: var(--code-editor-font-family);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1, "lnum" 1;
}

.metric-value,
.kpi-value,
.scorecard-value {
  font-family: var(--font-family-metric);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1, "lnum" 1;
}

.ds-tooltip {
  display: inline-flex;
  align-items: center;
  gap: var(--spacer-6);
  padding: var(--spacer-6) var(--spacer-8);
  background: var(--bg-tooltip);
  color: var(--text-default);
  border: 1px solid var(--border-neutral-l2);
  border-radius: var(--radius-8);
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  box-shadow: 0 12px 32px color-mix(in srgb, var(--text-default) 16%, transparent);
}

.ds-popover {
  background: var(--bg-base-default);
  border: 1px solid var(--border-neutral-l2);
  border-radius: var(--radius-12);
  padding: var(--spacer-8);
  box-shadow: 0 12px 32px color-mix(in srgb, var(--text-default) 16%, transparent);
}

.ds-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: var(--spacer-40) var(--spacer-24);
  color: var(--text-tertiary);
  text-align: center;
  border: 1px dashed var(--border-neutral-l1);
  border-radius: var(--radius-12);
}

.ds-empty__icon {
  width: 40px;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border-neutral-l1);
  margin-bottom: var(--spacer-12);
  color: var(--icon-secondary);
  border-radius: var(--radius-8);
}

.ds-empty__title {
  color: var(--text-default);
  font-size: var(--body-base-font-size);
  font-weight: var(--font-weight-medium, 500);
  margin-bottom: var(--spacer-4);
}

.ds-empty__desc {
  font-size: var(--body-sm-font-size);
}

.ds-code {
  background: var(--bg-overlay-l1);
  border: 1px solid var(--border-neutral-l1);
  border-radius: var(--radius-8);
  padding: var(--spacer-12) var(--spacer-16);
  color: var(--text-default);
  font-family: var(--code-editor-font-family);
  font-size: var(--code-editor-font-size);
  line-height: var(--code-editor-line-height);
  white-space: pre;
  overflow: auto;
}

.ds-kbd {
  display: inline-flex;
  align-items: center;
  padding: 0 var(--spacer-6);
  height: 20px;
  background: transparent;
  border: 1px solid var(--border-neutral-l1);
  border-radius: var(--radius-8);
  box-shadow: none;
  font-family: var(--body-md-font-family);
  font-size: var(--body-md-font-size);
  font-weight: var(--font-weight-default, 400);
  font-variant-numeric: normal;
  font-feature-settings: normal;
  letter-spacing: var(--body-md-letter-spacing);
  color: var(--text-secondary);
}

/* ── Alert ─────────────────────────────────────────────────── */
/* ===== Notification / Toast ===== */
    .ds-notif {
      display: flex; align-items: flex-start;
      gap: var(--spacer-8);
      width: 100%; max-width: 560px;
      padding: var(--spacer-8) var(--spacer-12);
      border: 1px solid var(--border-neutral-l1);
      background: var(--bg-base-secondary);
      border-radius: var(--radius-8);
      color: var(--text-default);
      font-family: var(--body-md-font-family);
      font-size: var(--body-md-font-size);
      line-height: var(--body-md-line-height);
      letter-spacing: var(--body-md-letter-spacing);
      box-shadow: none;
    }
    .ds-notif__icon { flex: 0 0 16px; width: 16px; height: 16px; margin-top: var(--spacer-2); color: var(--icon-default); display: inline-flex; align-items: center; justify-content: center; }
    .ds-notif__body { flex: 1; min-width: 0; }
    .ds-notif__title { font-family: var(--body-md-strong-font-family); font-size: var(--body-md-strong-font-size); line-height: var(--body-md-strong-line-height); font-weight: var(--body-md-strong-font-weight); letter-spacing: var(--body-md-strong-letter-spacing); color: var(--text-default); }
    .ds-notif__text { flex: 1; color: var(--text-default); }
    .ds-notif__desc { margin-top: var(--spacer-2); color: var(--text-secondary); font-size: var(--body-md-font-size); line-height: var(--body-md-line-height); }
    .ds-notif__actions { display: inline-flex; align-items: center; gap: var(--spacer-8); margin-top: var(--spacer-8); }
    .ds-notif__close { flex-shrink: 0; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: none; cursor: pointer; color: var(--icon-secondary); border-radius: var(--radius-8); }
    .ds-notif__close .icon { width: 14px; height: 14px; }
    .ds-notif__close:hover { background: var(--bg-overlay-l2); color: var(--icon-default); }
    .ds-notif--simple { align-items: center; }
    .ds-notif--error { background: var(--status-error-surface-l1); border-color: var(--status-error-surface-l2); }
    .ds-notif--error .ds-notif__icon { color: var(--status-error-default); }
    .ds-notif--warning { background: var(--status-warning-surface-l1); border-color: var(--status-warning-surface-l2); }
    .ds-notif--warning .ds-notif__icon { color: var(--status-warning-default); }
    .ds-notif--alert { background: var(--status-alert-surface-l1); border-color: var(--status-alert-surface-l2); }
    .ds-notif--alert .ds-notif__icon { color: var(--status-alert-default); }
    .ds-notif--info { background: var(--status-primary-surface-l1); border-color: var(--status-primary-surface-l2); }
    .ds-notif--info .ds-notif__icon { color: var(--status-primary-default); }
    .ds-notif--success { background: var(--status-success-surface-l1); border-color: var(--status-success-surface-l2); }
    .ds-notif--success .ds-notif__icon { color: var(--status-success-default); }

    /* ===== Alert / Banner ===== */
    .ds-alert {
      display: flex; align-items: flex-start;
      gap: var(--spacer-12);
      padding: var(--spacer-12) var(--spacer-16);
      background: var(--bg-base-secondary);
      border: 1px solid var(--border-neutral-l1);
      border-radius: var(--radius-8);
      color: var(--text-default);
      font-family: var(--body-md-font-family);
      font-size: var(--body-md-font-size);
      line-height: var(--body-md-line-height);
      letter-spacing: var(--body-md-letter-spacing);
    }
    .ds-alert__icon { flex: 0 0 16px; width: 16px; height: 16px; margin-top: var(--spacer-2); color: var(--icon-default); display: inline-flex; align-items: center; justify-content: center; }
    .ds-notif__icon .icon, .ds-alert__icon .icon { width: 16px; height: 16px; display: block; }
    .ds-alert--success .ds-alert__icon { color: var(--status-success-default); }
    .ds-alert--warning .ds-alert__icon { color: var(--status-warning-default); }
    .ds-alert--danger .ds-alert__icon { color: var(--status-error-default); }
    .ds-alert--info .ds-alert__icon { color: var(--status-primary-default); }
    .ds-alert__title { font-family: var(--body-md-strong-font-family); font-size: var(--body-md-strong-font-size); line-height: var(--body-md-strong-line-height); font-weight: var(--body-md-strong-font-weight); letter-spacing: var(--body-md-strong-letter-spacing); margin-bottom: var(--spacer-4); }
    .ds-alert__desc { color: var(--text-secondary); font-size: var(--body-md-font-size); line-height: var(--body-md-line-height); }

/* ── Avatar ────────────────────────────────────────────────── */
/* ===== Avatar ===== */
    .ds-avatar {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: var(--radius-full);
      background: var(--bg-overlay-l3);
      color: var(--text-default);
      font-family: var(--body-base-strong-font-family);
      font-size: var(--body-base-strong-font-size);
      font-weight: var(--body-base-strong-font-weight);
      line-height: var(--body-base-strong-line-height);
      flex-shrink: 0;
    }
    .ds-avatar--sm { width: 24px; height: 24px; font-size: var(--body-sm-font-size); }
    .ds-avatar--lg { width: 40px; height: 40px; }

/* ── Breadcrumb ────────────────────────────────────────────── */
/* ===== Breadcrumb ===== */
    .ds-breadcrumb { display: flex; align-items: center; gap: var(--spacer-8); font-size: var(--body-base-font-size); line-height: var(--body-base-line-height); color: var(--text-tertiary); }
    .ds-breadcrumb a { display: inline-flex; align-items: center; color: var(--text-tertiary); }
    .ds-breadcrumb a:hover { color: var(--text-default); }
    .ds-breadcrumb__sep { color: var(--text-tertiary); }
    .ds-breadcrumb__current { color: var(--text-default); }

/* ── Buttons ───────────────────────────────────────────────── */
/* ===== Buttons ===== */
    .ds-btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: var(--spacer-6);
      height: 28px; padding: 0 var(--spacer-12);
      border-radius: var(--radius-8);
      border: 1px solid transparent;
      cursor: pointer; user-select: none; white-space: nowrap;
      font-family: var(--body-base-strong-font-family);
      font-size: var(--body-base-strong-font-size);
      line-height: var(--body-base-strong-line-height);
      font-weight: var(--body-base-strong-font-weight);
      letter-spacing: var(--body-base-strong-letter-spacing);
      transition: background .12s ease, color .12s ease, border-color .12s ease, opacity .12s ease;
    }
    .ds-btn .icon {
      display: inline-block;
      width: var(--icon-size-16);
      height: var(--icon-size-16);
      flex: 0 0 auto;
    }
    .ds-btn .icon--12 { width: var(--icon-size-12); height: var(--icon-size-12); }
    .ds-btn .icon--14 { width: var(--icon-size-14); height: var(--icon-size-14); }
    .ds-btn .icon--16 { width: var(--icon-size-16); height: var(--icon-size-16); }
    .ds-btn .icon--20 { width: var(--icon-size-20); height: var(--icon-size-20); }
    .ds-btn .icon--24 { width: var(--icon-size-24); height: var(--icon-size-24); }
    /* Button heights are fixed to 24 / 28 / 32px. */
    .ds-btn--sm { height: 24px; padding: 0 var(--spacer-8); border-radius: var(--radius-8); font-size: var(--body-sm-font-size); }
    .ds-btn--md { height: 28px; padding: 0 var(--spacer-12); border-radius: var(--radius-8); }
    .ds-btn--lg { height: 32px; padding: 0 var(--spacer-16); border-radius: var(--radius-8); font-size: var(--body-base-font-size); }
    .ds-btn--primary { background: var(--bg-invert); color: var(--text-white); border-color: var(--bg-invert); }
    .ds-btn--primary:hover { background: var(--bg-invert-hover); border-color: var(--bg-invert-hover); }
    .ds-btn--primary:active { background: var(--bg-invert-active); border-color: var(--bg-invert-active); }
    .ds-btn--primary[disabled] { background: var(--bg-invert-disabled); color: var(--text-disabled); border-color: transparent; cursor: not-allowed; }
    .ds-btn--secondary { background: var(--bg-overlay-l1); color: var(--text-default); border-color: var(--border-neutral-l1); }
    .ds-btn--secondary:hover { background: var(--bg-overlay-l2); border-color: var(--border-neutral-l2); }
    .ds-btn--secondary:active { background: var(--bg-overlay-l3); border-color: var(--border-neutral-l3); }
    .ds-btn--secondary[disabled] { color: var(--text-disabled); cursor: not-allowed; opacity: .7; }
    .ds-btn--tertiary,
    .ds-btn--ghost { background: transparent; color: var(--text-default); border-color: transparent; }
    .ds-btn--tertiary:hover,
    .ds-btn--ghost:hover { background: var(--bg-overlay-l2); color: var(--text-default-hover); }
    .ds-btn--tertiary:active,
    .ds-btn--ghost:active { background: var(--bg-overlay-l3); }
    .ds-btn--tertiary[disabled],
    .ds-btn--ghost[disabled] { color: var(--text-disabled); cursor: not-allowed; }
    .ds-btn--danger,
    .ds-btn--danger-strong { background: var(--status-error-default); color: var(--text-onaccent); border-color: var(--status-error-default); }
    .ds-btn--danger:hover,
    .ds-btn--danger-strong:hover { background: var(--status-error-hover); border-color: var(--status-error-hover); }
    .ds-btn--danger:active,
    .ds-btn--danger-strong:active { background: var(--status-error-active); border-color: var(--status-error-active); }
    .ds-btn--danger-subtle { background: var(--status-error-surface-l1); color: var(--status-error-default); border-color: var(--status-error-surface-l2); }
    .ds-btn--danger-subtle:hover { background: var(--status-error-surface-l2); }
    .ds-btn--danger-subtle:active { background: var(--status-error-surface-l3); }
    .ds-btn--warning { background: var(--status-warning-default); color: var(--text-onaccent); border-color: var(--status-warning-default); }
    .ds-btn--warning:hover { background: var(--status-warning-hover); border-color: var(--status-warning-hover); }
    .ds-btn--warning:active { background: var(--status-warning-active); border-color: var(--status-warning-active); }
    .ds-btn--brand { background: var(--bg-brand); color: var(--text-onbrand); border-color: var(--bg-brand); }
    .ds-btn--brand:hover { background: var(--bg-brand-hover); border-color: var(--bg-brand-hover); }
    .ds-btn--brand:active { background: var(--bg-brand-active); border-color: var(--bg-brand-active); }
    .ds-btn--brand[disabled] { background: var(--bg-brand-disabled); border-color: transparent; color: var(--text-onbrand); cursor: not-allowed; }
    .ds-btn--link { background: transparent; color: var(--text-default); border-color: transparent; padding: 0; height: auto; }
    .ds-btn--link:hover { color: var(--text-default-hover); text-decoration: underline; }
    .ds-btn--link[disabled] { color: var(--text-disabled); text-decoration: none; cursor: not-allowed; }
    .ds-btn--icon { width: 28px; padding: 0; justify-content: center; }
    .ds-btn--icon.ds-btn--sm { width: 24px; }
    .ds-btn--icon.ds-btn--lg { width: 32px; }
    .ds-btn-group { display: inline-flex; }
    .ds-btn-group > .ds-btn { border-radius: var(--radius-0); margin-left: calc(-1 * var(--border-width-default)); }
    .ds-btn-group > .ds-btn:first-child { border-top-left-radius: var(--radius-8); border-bottom-left-radius: var(--radius-8); margin-left: 0; }
    .ds-btn-group > .ds-btn:last-child { border-top-right-radius: var(--radius-8); border-bottom-right-radius: var(--radius-8); }

/* ── Cards ─────────────────────────────────────────────────── */
/* ===== Card ===== */
    .ds-card {
      background: var(--bg-base-secondary);
      border: 1px solid var(--border-neutral-l1);
      border-radius: var(--radius-12);
      padding: var(--spacer-20);
      color: var(--text-default);
    }
    .ds-card__title { font-size: var(--heading-sm-font-size); line-height: var(--heading-sm-line-height); font-weight: var(--heading-sm-font-weight); margin-bottom: var(--spacer-8); }
    .ds-card__desc { font-size: var(--body-base-font-size); line-height: var(--body-base-line-height); color: var(--text-secondary); }

/* ── Dialog ────────────────────────────────────────────────── */
/* ===== Dialog / Modal ===== */
    .ds-backdrop { position: relative; background: var(--bg-overlay-l4); border: 1px solid var(--border-neutral-l1); padding: var(--spacer-32) var(--spacer-24); display: flex; align-items: center; justify-content: center; }
    .ds-dialog { background: var(--bg-base-default); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-12); width: 100%; max-width: 520px; overflow: hidden; color: var(--text-default); box-shadow: 0 24px 64px color-mix(in srgb, var(--text-default) 14%, transparent), 0 4px 16px color-mix(in srgb, var(--text-default) 8%, transparent); }
    .ds-dialog--form { max-width: 560px; }
    .ds-dialog__head { padding: var(--spacer-16) var(--spacer-20); display: flex; align-items: center; justify-content: space-between; border-bottom: 0; }
    .ds-dialog__title { font-size: var(--heading-sm-font-size); line-height: var(--heading-sm-line-height); font-weight: var(--heading-sm-font-weight); color: var(--text-default); }
    .ds-dialog__close { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: none; color: var(--icon-secondary); cursor: pointer; border-radius: var(--radius-8); }
    .ds-dialog__close:hover { background: var(--bg-overlay-l2); color: var(--icon-default); }
    .ds-dialog__body { padding: var(--spacer-16) var(--spacer-20); color: var(--text-secondary); font-size: var(--body-base-font-size); line-height: var(--body-base-line-height); }
    .ds-dialog__foot { padding: var(--spacer-12) var(--spacer-20); display: flex; justify-content: flex-end; gap: var(--spacer-8); border-top: 0; }
    .ds-drawer { background: var(--bg-base-default); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-12); width: 100%; max-width: 360px; display: flex; flex-direction: column; box-shadow: 0 24px 64px color-mix(in srgb, var(--text-default) 14%, transparent), 0 4px 16px color-mix(in srgb, var(--text-default) 8%, transparent); }
    .ds-drawer__head { padding: var(--spacer-16) var(--spacer-20); display: flex; justify-content: space-between; align-items: center; border-bottom: 0; }
    .ds-drawer__body { padding: var(--spacer-16) var(--spacer-20); flex: 1; }
    .dialog-form { display: grid; gap: var(--spacer-16); }
    .dialog-field { display: flex; flex-direction: column; gap: var(--spacer-6); }
    .dialog-field__label { color: var(--text-default); font-size: var(--body-base-font-size); line-height: var(--body-base-line-height); font-weight: var(--font-weight-medium); }
    .dialog-field__hint { color: var(--text-tertiary); font-size: var(--body-base-font-size); line-height: var(--body-base-line-height); }
    .dialog-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--spacer-12); }
    .dialog-form .ds-input,
    .dialog-form .ds-select,
    .dialog-form .ds-textarea { background: var(--bg-base-default); font-size: var(--body-base-font-size); line-height: var(--body-base-line-height); letter-spacing: var(--body-base-letter-spacing); }
    .dialog-form .ds-input:focus-within,
    .dialog-form .ds-select:focus,
    .dialog-form .ds-textarea:focus { background: var(--bg-base-default); }
    .dialog-form .ds-textarea { min-height: 72px; resize: none; }
    .dialog-calendar-icon { width: 16px; height: 16px; color: var(--icon-secondary); object-fit: contain; }
    @media (max-width: 720px) { .dialog-grid { grid-template-columns: 1fr; } }

/* ── Forms ─────────────────────────────────────────────────── */
/* ===== Input / Search ===== */
    .ds-input { display: flex; align-items: center; gap: var(--spacer-8); min-height: 32px; padding: 0 var(--spacer-12); background: var(--bg-base-default); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-8); color: var(--text-default); width: 100%; font-family: var(--body-base-font-family); font-size: var(--body-base-font-size); line-height: var(--body-base-line-height); }
    .ds-input:focus-within { border-color: var(--border-contrast); background: var(--bg-base-default); }
    .ds-input input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-default); font: inherit; min-width: 0; }
    .ds-input input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
    .ds-input input[type="number"]::-webkit-outer-spin-button,
    .ds-input input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .ds-input input::placeholder { color: var(--text-tertiary); }
    .ds-input input:disabled { color: var(--text-disabled); cursor: not-allowed; }
    .ds-input.is-error { border-color: var(--status-error-default); }
    .ds-input.is-disabled { background: var(--bg-base-secondary); color: var(--text-disabled); cursor: not-allowed; }
    .ds-input__icon { color: var(--icon-secondary); display: inline-flex; align-items: center; }
    .ds-search { position: relative; }
    .ds-select { width: 100%; height: 32px; padding: 0 var(--spacer-32) 0 var(--spacer-12); background-color: var(--bg-base-default); color: var(--text-default); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-8); appearance: none; -webkit-appearance: none; font: inherit; font-size: var(--body-base-font-size); }
    .ds-select:focus { border-color: var(--border-contrast); background-color: var(--bg-base-default); outline: none; }
    .ds-select:disabled { background-color: var(--bg-base-secondary); color: var(--text-disabled); cursor: not-allowed; opacity: 1; }
    .ds-select-wrap { position: relative; width: 100%; }
    .ds-select-wrap .ds-select { padding-right: var(--spacer-32); }
    .ds-select__icon { position: absolute; right: var(--spacer-12); top: 50%; width: 16px; height: 16px; color: var(--icon-secondary); pointer-events: none; transform: translateY(-50%); object-fit: contain; }
    .ds-select-wrap > .icon-img { position: absolute; top: 50%; right: var(--spacer-10); transform: translateY(-50%); color: var(--icon-secondary); pointer-events: none; }
    .icon-img { display: inline-block; width: 16px; height: 16px; flex: 0 0 16px; object-fit: contain; vertical-align: middle; }
    .icon-img--12 { width: 12px; height: 12px; flex-basis: 12px; }
    .icon-img--14 { width: 14px; height: 14px; flex-basis: 14px; }
    .ds-textarea { width: 100%; min-height: 96px; padding: var(--spacer-8) var(--spacer-12); background: var(--bg-base-default); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-8); color: var(--text-default); font-family: var(--body-base-font-family); font-size: var(--body-base-font-size); line-height: var(--body-base-line-height); resize: none; }
    .ds-textarea:focus { outline: none; border-color: var(--border-contrast); background: var(--bg-base-default); }
    .ds-textarea.is-error { border-color: var(--status-error-default); }

        <div class="h-11 px-3 flex items-center gap-2 shrink-0 border-b" style="border-color:var(--border-neutral-l1);">
          <i data-lucide="library" class="size-4" style="color:var(--icon-tertiary);"></i>
          <span style="font-size:var(--body-sm-font-size);font-weight:var(--font-weight-medium);color:var(--text-tertiary);">作品导航</span>
        </div>
        <!-- Project info -->
        <div class="px-3 py-2.5 border-b" style="border-color:var(--border-neutral-l1);">
          <div style="font-size:var(--body-base-font-size);font-weight:var(--font-weight-medium);color:var(--text-default);" class="truncate">星河彼岸</div>
          <div class="flex items-center gap-1.5 mt-1">
            <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded" style="font-size:10px;background:var(--bg-brand-popup);color:var(--text-brand);">
              <i data-lucide="sparkles" class="size-2.5"></i>
              连载中
            </span>
            <span style="font-size:10px;color:var(--text-tertiary);">25 章</span>
          </div>
        </div>
        <!-- Chapter list -->
        <div class="flex-1 overflow-y-auto py-1" data-scroll-region="sidebar" style="font-size:var(--body-sm-font-size);">
          <div class="px-3 py-1.5 flex items-center gap-1.5" style="color:var(--text-tertiary);font-weight:var(--font-weight-medium);text-transform:uppercase;letter-spacing:0.05em;font-size:10px;">
            <i data-lucide="list" class="size-3"></i>
            章节列表
          </div>
          <!-- Chapter items -->
          <div id="sidebar-chapters"></div>
        </div>
        <!-- Sidebar footer with outline toggle -->
        <div class="h-9 px-3 flex items-center gap-2 border-t shrink-0" style="border-color:var(--border-neutral-l1);color:var(--text-tertiary);">
          <button class="inline-flex items-center gap-1.5 px-2 h-7 rounded-md transition-[background-color] duration-150 hover:bg-[var(--bg-overlay-l1)]" style="font-size:var(--body-sm-font-size);">
            <i data-lucide="chevrons-left" class="size-3.5"></i>
            收起侧栏
          </button>
        </div>
      </aside>

      <!-- ========== Main Matrix Workspace ========== -->
      <section class="flex-1 min-w-0 flex flex-col overflow-hidden">
        <!-- Matrix Toolbar -->
        <div class="relative z-20 flex items-center gap-1.5 flex-wrap px-3 min-h-11 py-1.5 border-b shrink-0" style="background:var(--bg-base-default);border-color:var(--border-neutral-l1);font-size:var(--body-sm-font-size);">
          <!-- Back button -->
          <button class="inline-flex size-8 items-center justify-center rounded-md transition-[color,background-color,transform] duration-200 ease-out active:scale-[0.96] hover:bg-[var(--bg-overlay-l1)]" style="color:var(--icon-tertiary);" aria-label="返回" title="返回">
            <i data-lucide="arrow-left" class="size-3.5"></i>
          </button>
          <!-- View Switcher (segmented control) -->
          <div class="inline-flex gap-0.5 p-0.5 rounded-lg" style="background:var(--bg-base-secondary);">
            <button class="inline-flex items-center gap-1.5 h-7 px-3 rounded-[6px] transition-all duration-200 ease-out active:scale-[0.96]" style="background:var(--bg-base-default);color:var(--text-default);box-shadow:0 1px 2px rgba(0,0,0,0.05);font-size:11px;font-weight:var(--font-weight-medium);">
              <i data-lucide="layout-grid" class="size-3"></i>
              矩阵
            </button>
            <button class="inline-flex items-center gap-1.5 h-7 px-3 rounded-[6px] transition-all duration-200 ease-out active:scale-[0.96] hover:bg-[var(--bg-overlay-l1)]" style="color:var(--text-tertiary);font-size:11px;font-weight:var(--font-weight-medium);">
              <i data-lucide="kanban" class="size-3"></i>
              画布
            </button>
          </div>

          <!-- Divider -->
          <div class="mx-1 h-5 w-px" style="background:var(--border-neutral-l1);"></div>

          <!-- Chapter counter "8 / 25" -->
          <span class="px-1 tabular-nums" style="font-family:var(--code-editor-font-family);font-size:11px;color:var(--text-tertiary);">8 / 25</span>

          <!-- Current chapter badge (amber) -->
          <div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full border" style="background:rgba(245,158,11,0.10);border-color:rgba(245,158,11,0.30);color:#f59e0b;font-size:11px;font-weight:var(--font-weight-medium);">
            <span class="w-1.5 h-1.5 rounded-full" style="background:#f59e0b;box-shadow:0 0 6px #f59e0b;"></span>
            <span style="font-family:var(--code-editor-font-family);opacity:0.8;">CH.08</span>
            <span class="truncate" style="max-width:140px;">初入江湖</span>
          </div>

          <!-- Divider -->
          <div class="mx-1 h-5 w-px" style="background:var(--border-neutral-l1);"></div>

          <!-- Undo / Redo (disabled) -->
          <button disabled class="inline-flex size-8 items-center justify-center rounded-md transition-[color,background-color,transform] duration-200 ease-out active:scale-[0.96] hover:bg-[var(--bg-overlay-l1)] disabled:cursor-not-allowed disabled:opacity-40" style="color:var(--icon-tertiary);" aria-label="撤销" title="撤销">
            <i data-lucide="undo-2" class="size-3.5"></i>
          </button>
          <button disabled class="inline-flex size-8 items-center justify-center rounded-md transition-[color,background-color,transform] duration-200 ease-out active:scale-[0.96] hover:bg-[var(--bg-overlay-l1)] disabled:cursor-not-allowed disabled:opacity-40" style="color:var(--icon-tertiary);" aria-label="重做" title="重做">
            <i data-lucide="redo-2" class="size-3.5"></i>
          </button>

          <!-- Divider -->
          <div class="mx-1 h-5 w-px" style="background:var(--border-neutral-l1);"></div>

          <!-- Zoom control -->
          <div class="inline-flex items-center overflow-hidden rounded-md border" style="background:var(--bg-base-tertiary);border-color:var(--border-neutral-l1);">
            <button class="inline-flex size-7 items-center justify-center transition-[background-color] duration-150 hover:bg-[var(--bg-overlay-l1)]" style="color:var(--icon-tertiary);" aria-label="缩小" title="缩小">
              <i data-lucide="minus" class="size-3"></i>
            </button>
            <span class="tabular-nums text-center px-1 min-w-[42px]" style="font-family:var(--code-editor-font-family);font-size:11px;color:var(--text-tertiary);">100%</span>
            <button class="inline-flex size-7 items-center justify-center transition-[background-color] duration-150 hover:bg-[var(--bg-overlay-l1)]" style="color:var(--icon-tertiary);" aria-label="放大" title="放大">
              <i data-lucide="plus" class="size-3"></i>
            </button>
          </div>

          <!-- Divider -->
          <div class="mx-1 h-5 w-px" style="background:var(--border-neutral-l1);"></div>

          <!-- Completion history button with badge -->
          <button class="inline-flex size-8 items-center justify-center rounded-md transition-[color,background-color,transform] duration-200 ease-out active:scale-[0.96] hover:bg-[var(--bg-overlay-l1)] relative" style="color:var(--icon-tertiary);" aria-label="补全历史" title="补全历史">
            <i data-lucide="history" class="size-3.5"></i>
            <span class="absolute -top-0.5 -right-0.5 min-w-[14px] h-[14px] px-1 inline-flex items-center justify-center rounded-full text-[9px] font-semibold" style="background:var(--status-error-default);color:#fff;">2</span>
          </button>
          <!-- AI Organize button -->
          <button class="inline-flex size-8 items-center justify-center rounded-md transition-[color,background-color,transform] duration-200 ease-out active:scale-[0.96] hover:bg-[var(--bg-overlay-l1)]" style="color:var(--icon-tertiary);" aria-label="AI 整理" title="AI 整理">
            <i data-lucide="wand" class="size-3.5"></i>
          </button>

          <!-- Spacer -->
          <div class="flex-1"></div>

          <!-- Filter chips area -->
          <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar shrink-0" id="filter-chips">
            <!-- Chips will be injected by JS for cleanliness; also static fallback below -->
          </div>
        </div>

        <!-- Matrix Gantt Body -->
        <div class="flex-1 min-h-0 overflow-auto relative" data-scroll-region="primary" id="matrix-scroll">
          <!-- The matrix table structure -->
          <div class="relative" id="matrix-container" style="min-width:1640px;">
            <!-- Chapter Ruler (sticky top within scroll area) -->
            <div class="sticky top-0 z-20 flex border-b h-11" style="background:var(--bg-base-default);border-color:var(--border-neutral-l1);">
              <!-- Entity column header (sticky left) -->
              <div class="sticky left-0 z-30 flex items-center px-3 border-r shrink-0" style="width:240px;background:var(--bg-base-default);border-color:var(--border-neutral-l1);">
                <span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-tertiary);">实体 / 章节</span>
              </div>
              <!-- Chapter cells header -->
              <div class="flex" id="chapter-ruler"></div>
            </div>

            <!-- Current chapter highlight column (absolute overlay) -->
            <div id="current-ch-highlight" class="absolute z-10 pointer-events-none" style="top:44px;bottom:0;border-left:1px solid rgba(245,158,11,0.30);border-right:1px solid rgba(245,158,11,0.30);background:rgba(245,158,11,0.07);"></div>
            <!-- Current chapter floating label CH.08 -->
            <div id="current-ch-label" class="absolute z-30 pointer-events-none flex items-center gap-0.5 rounded-md px-1.5 h-4 whitespace-nowrap tabular-nums" style="top:44px;left:0;background:#f59e0b;color:#fff;font-size:10px;font-weight:600;box-shadow:0 4px 8px rgba(0,0,0,0.12);font-family:var(--code-editor-font-family);transform:translate(-50%,-50%);">CH.08</div>

            <!-- Rows container -->
            <div id="matrix-rows" class="relative"></div>

            <!-- Resize handle between entity column and timeline -->
            <div class="absolute top-0 bottom-0 z-[35] w-1.5 cursor-col-resize hover:bg-[var(--bg-brand)]/30 active:bg-[var(--bg-brand)]/50" style="left:240px;background:transparent;"></div>

            <!-- Legend (fixed to bottom-right of scroll area) -->
            <div class="absolute bottom-3 right-3 z-40 rounded-lg p-2.5 backdrop-blur-sm border" style="background:rgba(255,255,255,0.95);border-color:var(--border-neutral-l1);box-shadow:0 8px 24px rgba(0,0,0,0.08);">
              <div class="flex items-center gap-1.5 mb-2" style="font-size:11px;font-weight:600;color:var(--text-default);">
                <i data-lucide="legend" class="size-3" style="color:var(--icon-tertiary);"></i>
                图例
              </div>
              <div class="grid grid-cols-2 gap-x-4 gap-y-1" id="legend-items"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <style>
      /* Custom scrollbar for webkit */
      [data-scroll-region]::-webkit-scrollbar { width: 6px; height: 6px; }
      [data-scroll-region]::-webkit-scrollbar-thumb { background: rgba(115,115,115,0.24); border-radius: 3px; }
      [data-scroll-region]::-webkit-scrollbar-thumb:hover { background: rgba(115,115,115,0.36); }
      [data-scroll-region]::-webkit-scrollbar-track { background: transparent; }

      /* Gantt cell basics */
      .ch-cell {
        flex-shrink: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2px;
        border-right: 1px solid rgba(115,115,115,0.08);
      }
      .ch-cell--major { border-right-width: 2px; border-right-color: rgba(115,115,115,0.18); }
      .ch-cell--mid { border-right-color: rgba(115,115,115,0.12); }

      .entity-cell {
        position: sticky;
        left: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        flex-shrink: 0;
        border-right: 1px solid var(--border-neutral-l1);
        border-bottom: 1px solid rgba(115,115,115,0.06);
      }
      .matrix-row {
        display: flex;
        height: 32px;
        position: relative;
      }
      .matrix-row--zebra { background: rgba(115,115,115,0.04); }
      .matrix-row--selected { background: rgba(75,63,227,0.08); }
      .group-row {
        display: flex;
        align-items: center;
        height: 28px;
        padding: 0 8px;
        gap: 6px;
      }

      .gantt-band {
        position: absolute;
        top: 50%;
        z-index: 2;
        height: 19px;
        transform: translateY(-50%);
        border-radius: 6px;
        transition: filter .12s ease;
        cursor: pointer;
      }
      .gantt-band:hover { filter: brightness(1.08); }

      .chapter-dot {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.5;
      }

      /* Focus visible ring for interactive items */
      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px rgba(75,63,227,0.35);
      }

      @media (prefers-reduced-motion: reduce) {
        * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
      }
    </style>

    <script>
      // ========== Data ==========
      const CELL_W = 56; // chapter cell width
      const ENTITY_W = 240;
      const CURRENT_CH = 8;
      const TOTAL_CH = 25;

      // Category definitions with color tokens
      const CATEGORIES = [
        { key: 'all',        label: '全部',   color: null },
        { key: 'character',  label: '角色',   color: '#4b3fe3' },
        { key: 'conflict',   label: '冲突',   color: '#e8463a' },
        { key: 'clue',       label: '线索',   color: '#2f74ff' },
        { key: 'foreshadow', label: '伏笔',   color: '#9570ff' },
        { key: 'faction',    label: '势力',   color: '#15a877' },
        { key: 'location',   label: '地点',   color: '#e27900' },
        { key: 'world_element', label: '世界要素', color: '#3f31c6' },
        { key: 'info_layer', label: '信息层', color: '#747e94' },
      ];

      // Entity groups with bands: each band is [startCh, endCh] inclusive
      const GROUPS = [
        {
          key: 'character', label: '角色', color: '#4b3fe3', collapsed: false,
          entities: [
            { name: '林晚',   desc: '成长主角',     bands: [[1,25]] },
            { name: '陆星辰', desc: '守护者',       bands: [[3,22],[24,25]] },
            { name: '苏云裳', desc: '堕落与救赎',   bands: [[5,12],[18,24]] },
            { name: '老周',   desc: '引路人',       bands: [[2,8],[15,20]] },
          ]
        },
        {
          key: 'conflict', label: '冲突', color: '#e8463a', collapsed: false,
          entities: [
            { name: '权力之争', desc: '朝堂博弈', bands: [[5,15],[20,25]] },
            { name: '身世之谜', desc: '林晚身世', bands: [[8,22]] },
            { name: '旧怨新仇', desc: '江湖恩怨', bands: [[12,18]] },
          ]
        },
        {
          key: 'clue', label: '线索', color: '#2f74ff', collapsed: false,
          entities: [
            { name: '玉佩纹样', desc: '身世信物', bands: [[3,10],[16,21]] },
            { name: '密信残页', desc: '阴谋证据', bands: [[7,14],[22,25]] },
            { name: '古籍记载', desc: '灵脉秘辛', bands: [[11,19]] },
          ]
        },
        {
          key: 'foreshadow', label: '伏笔', color: '#9570ff', collapsed: false,
          entities: [
            { name: '童年记忆', desc: '梦境碎片', bands: [[1,6],[23,25]] },
            { name: '神秘预言', desc: '星象启示', bands: [[9,13],[24,25]] },
          ]
        },
        {
          key: 'faction', label: '势力', color: '#15a877', collapsed: false,
          entities: [
            { name: '朝云阁', desc: '正道领袖', bands: [[4,25]] },
            { name: '暗影盟', desc: '暗中势力', bands: [[10,25]] },
          ]
        },
        {
          key: 'location', label: '地点', color: '#e27900', collapsed: false,
          entities: [
            { name: '京城',   desc: '权力中心', bands: [[1,8],[20,25]] },
            { name: '江南',   desc: '游历之地', bands: [[9,19]] },
            { name: '边关',   desc: '战场所在', bands: [[15,22]] },
          ]
        },
        {
          key: 'world_element', label: '世界要素', color: '#3f31c6', collapsed: false,
          entities: [
            { name: '灵脉体系', desc: '力量根基', bands: [[2,25]] },
            { name: '武学境界', desc: '修炼体系', bands: [[6,25]] },
          ]
        },
        {
          key: 'info_layer', label: '信息层', color: '#747e94', collapsed: false,
          entities: [
            { name: '读者已知', desc: '叙事视角', bands: [[1,25]] },
            { name: '角色未知', desc: '信息差',   bands: [[5,20]] },
          ]
        },
      ];

      // ========== Render helpers ==========
      function $sel(s){ return document.querySelector(s); }

      function chapterLabel(n){ return String(n).padStart(2,'0'); }

      function isMajorCh(n){ return n % 10 === 0; }
      function isMidCh(n){ return n % 5 === 0; }

      // Render sidebar chapters
      function renderSidebarChapters(){
        const el = $sel('#sidebar-chapters');
        let html = '';
        for(let i=1;i<=TOTAL_CH;i++){
          const isCur = i === CURRENT_CH;
          html += `<div class="flex items-center gap-2 px-3 h-7 cursor-pointer transition-[background-color] duration-120 ${isCur?'':'hover:bg-[var(--bg-overlay-l1)]'}" style="${isCur?'background:rgba(245,158,11,0.08);':''}font-size:var(--body-sm-font-size);">
            <span class="w-5 text-right tabular-nums shrink-0" style="font-family:var(--code-editor-font-family);font-size:10px;color:${isCur?'#f59e0b':'var(--text-tertiary)'};${isCur?'font-weight:600;':''}">${chapterLabel(i)}</span>
            <span class="truncate flex-1" style="color:${isCur?'var(--text-default)':'var(--text-secondary)'};${isCur?'font-weight:500;':''}">${getChapterTitle(i)}</span>
            ${isCur?'<span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:#f59e0b;box-shadow:0 0 4px #f59e0b;"></span>':''}
          </div>`;
        }
        el.innerHTML = html;
      }

      function getChapterTitle(n){
        const titles = {
          1:'山村少年',2:'灵脉初觉',3:'玉佩之谜',4:'拜入宗门',5:'同门之谊',
          6:'秘境试炼',7:'暗流涌动',8:'初入江湖',9:'江南烟雨',10:'朝云大会',
          11:'古籍线索',12:'旧怨浮现',13:'预言应验',14:'密信真相',15:'边关烽火',
          16:'玉佩溯源',17:'灵脉异动',18:'苏云裳之变',19:'暗影现身',20:'京城风云',
          21:'身世揭晓',22:'终极对决',23:'童年真相',24:'最终之战',25:'星河彼岸'
        };
        return titles[n] || ('第'+n+'章');
      }

      // Render filter chips
      function renderChips(){
        const el = $sel('#filter-chips');
        let html = '';
        CATEGORIES.forEach(c=>{
          const active = c.key === 'all';
          const dotStyle = c.color
            ? `background:${active?'#fff':c.color};`
            : `background:${active?'#fff':'var(--text-tertiary)'};`;
          html += `<button class="inline-flex h-8 items-center gap-1 px-2.5 rounded-[6px] border transition-all duration-200 ease-out active:scale-[0.96] shrink-0" style="
            font-size:11px;
            ${active
              ? `background:${c.color||'var(--bg-brand)'};border-color:${c.color||'var(--bg-brand)'};color:#fff;`
              : `background:var(--bg-base-default);border-color:var(--border-neutral-l1);color:var(--text-tertiary);`}
          " onmouseover="if(!this.dataset.active){this.style.borderColor='var(--border-neutral-l2)';this.style.color='var(--text-default)';}"
           onmouseout="if(!this.dataset.active){this.style.borderColor='var(--border-neutral-l1)';this.style.color='var(--text-tertiary)';}">
            <span class="w-1.5 h-1.5 rounded-full shrink-0" style="${dotStyle}"></span>
            ${c.label}
          </button>`;
        });
        el.innerHTML = html;
        // mark active
        el.querySelectorAll('button')[0].dataset.active = '1';
      }

      // Render chapter ruler
      function renderRuler(){
        const el = $sel('#chapter-ruler');
        let html = '';
        for(let i=1;i<=TOTAL_CH;i++){
          let cls = 'ch-cell';
          let color = 'var(--text-disabled)';
          let weight = '400';
          if(i===CURRENT_CH){ color='#f59e0b'; weight='600'; }
          else if(isMajorCh(i)){ cls += ' ch-cell--major'; color='var(--text-default)'; weight='600'; }
          else if(isMidCh(i)){ cls += ' ch-cell--mid'; color='var(--text-tertiary)'; }
          html += `<div class="${cls}" style="width:${CELL_W}px;">
            <span class="tracking-wide tabular-nums" style="font-family:var(--code-editor-font-family);font-size:11px;color:${color};font-weight:${weight};">${chapterLabel(i)}</span>
          </div>`;
        }
        el.innerHTML = html;
      }

      // Render matrix rows (groups + entities)
      function renderRows(){
        const el = $sel('#matrix-rows');
        let html = '';
        let totalEntities = 0;
        GROUPS.forEach(g=>{
          // Group header
          html += `<div class="group-row" style="background:rgba(115,115,115,0.04);width:${ENTITY_W + CELL_W*TOTAL_CH}px;">
            <div class="sticky left-0 z-[6] flex items-center gap-1.5 px-2" style="width:${ENTITY_W}px;background:rgba(115,115,115,0.04);">
              <i data-lucide="chevron-down" class="size-3.5 shrink-0 transition-transform" style="color:var(--icon-tertiary);"></i>
              <span class="w-3 h-3 rounded-sm shrink-0" style="background:${g.color};"></span>
              <span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-default);">${g.label}</span>
              <span class="tabular-nums" style="font-size:10px;color:var(--text-tertiary);font-family:var(--code-editor-font-family);">${g.entities.length}</span>
            </div>
          </div>`;
          // Entity rows
          g.entities.forEach((ent, idx)=>{
            totalEntities++;
            const isZebra = totalEntities % 2 === 0;
            const zebraCls = isZebra ? 'matrix-row--zebra' : '';
            const cellBg = isZebra ? 'rgba(115,115,115,0.04)' : 'var(--bg-base-default)';
            html += `<div class="matrix-row ${zebraCls}" style="width:${ENTITY_W + CELL_W*TOTAL_CH}px;">
              <div class="entity-cell" style="width:${ENTITY_W}px;background:${cellBg};">
                <span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:${g.color};"></span>
                <span style="font-size:12px;color:var(--text-default);font-weight:500;" class="truncate">${ent.name}</span>
                <span class="truncate flex-1 text-right" style="font-size:10px;color:var(--text-disabled);">${ent.desc}</span>
              </div>
              <div class="relative flex-1" style="width:${CELL_W*TOTAL_CH}px;">
                ${ent.bands.map(([s,e])=>{
                  const left = (s-1)*CELL_W + 2;
                  const width = (e-s+1)*CELL_W - 4;
                  return `<div class="gantt-band" style="left:${left}px;width:${width}px;background:${hexToRgba(g.color,0.16)};border:1px solid ${hexToRgba(g.color,0.30)};"></div>`;
                }).join('')}
              </div>
            </div>`;
          });
        });
        el.innerHTML = html;
      }

      // Position current chapter highlight
      function positionCurrentHighlight(){
        const highlightEl = $sel('#current-ch-highlight');
        const labelEl = $sel('#current-ch-label');
        const chCenterX = ENTITY_W + (CURRENT_CH-0.5)*CELL_W;
        highlightEl.style.left = (ENTITY_W + (CURRENT_CH-1)*CELL_W) + 'px';
        highlightEl.style.width = CELL_W + 'px';
        labelEl.style.left = chCenterX + 'px';
      }

      // Render legend
      function renderLegend(){
        const el = $sel('#legend-items');
        let html = '';
        CATEGORIES.filter(c=>c.key!=='all').forEach(c=>{
          html += `<div class="flex items-center gap-1.5" style="font-size:10px;color:var(--text-secondary);">
            <span class="w-3 h-1.5 rounded-sm shrink-0" style="background:${hexToRgba(c.color,0.28)};border:1px solid ${hexToRgba(c.color,0.40)};"></span>
            ${c.label}
          </div>`;
        });
        // Add current chapter indicator
        html += `<div class="flex items-center gap-1.5 col-span-2 mt-1 pt-1" style="font-size:10px;color:var(--text-secondary);border-top:1px solid var(--border-neutral-l1);">
          <span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:#f59e0b;box-shadow:0 0 4px #f59e0b;"></span>
          当前章节 (CH.08)
        </div>`;
        el.innerHTML = html;
      }

      function hexToRgba(hex, a){
        const h = hex.replace('#','');
        const r = parseInt(h.substring(0,2),16);
        const g = parseInt(h.substring(2,4),16);
        const b = parseInt(h.substring(4,6),16);
        return `rgba(${r},${g},${b},${a})`;
      }

      // ========== Init ==========
      renderSidebarChapters();
      renderChips();
      renderRuler();
      renderRows();
      positionCurrentHighlight();
      renderLegend();
      // Initialize lucide icons after dynamic DOM injection
      if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>
