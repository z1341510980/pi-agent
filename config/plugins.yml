# pi-agent 插件配置文件
# 支持预设继承/覆盖（参考 DeepSeek Harness 的 agent.cordis.yml）
#
# 两种模式：
# 1. 预设模式（使用 presets + active）：支持继承和覆盖
# 2. 传统模式（直接使用 plugins）：向后兼容

# ===== 预设定义 =====
presets:
  # 基础预设：包含核心插件
  base:
    description: "基础功能预设"
    plugins:
      - id: novel-plugin
        source: builtin
        enabled: true
        isolate: false
        config:
          dataDir: ./data/novel
          maxChapters: 100
          maxTokensPerChapter: 8000
          defaultModel: deepseek-chat
          features:
            autoSave: true
            versionHistory: true
            scenePlanning: true

      - id: hello-plugin
        source: builtin
        enabled: false
        config:
          greeting: "Hello from base!"

  # 高级预设：继承 base，添加搜索功能，覆盖部分配置
  advanced:
    description: "高级功能预设（含搜索）"
    extends: base
    plugins:
      - id: web-search-plugin
        source: builtin
        enabled: true
        isolate: false
        config:
          searchEngine: google
          apiKey: ${WEB_SEARCH_API_KEY}
          timeoutMs: 30000
          maxResults: 10

      # 覆盖 base 中的 novel-plugin 配置
      - id: novel-plugin
        config:
          maxChapters: 200
          maxTokensPerChapter: 16000
          defaultModel: deepseek-reasoner

      # 启用 hello-plugin（base 中禁用了）
      - id: hello-plugin
        enabled: true
        config:
          greeting: "Hello from advanced!"

  # 调试预设：只加载小说插件，适合快速调试
  debug:
    description: "调试预设（仅小说插件）"
    plugins:
      - id: novel-plugin
        source: builtin
        enabled: true
        isolate: true
        config:
          dataDir: ./data/novel-debug
          maxChapters: 10
          maxTokensPerChapter: 4000

# 当前激活的预设（使用 advanced）
active: advanced

# ===== 配置说明 =====
# 
# 预设继承规则：
# 1. 子预设通过 extends 继承父预设的所有插件
# 2. 同名插件以子预设的配置覆盖父预设
# 3. config 字段会深度合并（子预设覆盖父预设的同名字段）
# 4. enabled 字段以子预设为准
#
# source 支持三种类型：
#   - builtin: 内置插件（在 plugin-loader 中注册的工厂函数）
#   - local: 本地文件系统插件（需要配置 localPluginsDir）
#   - npm: npm 包插件（包名以 wenlang-agent-plugin- 开头）
#
# isolate: true 时插件将运行在独立上下文中：
#   - 独立的数据库连接
#   - 独立的事件总线（仅接收本插件事件）
#   - 独立的日志上下文
#   - 适合需要高隔离性的第三方插件
#
# 环境变量引用：使用 ${VAR_NAME} 语法，启动时会自动替换