# searxng-settings.yml
use_default_settings: true

search:
  formats:
    - html
    - json

server:
  secret_key: "pi-agent-local-dev-secret-change-me"
  bind_address: "0.0.0.0"
  port: 8080

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false
  - name: bing
    engine: bing
    shortcut: b
    disabled: false
  - name: baidu
    engine: baidu
    shortcut: bd
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false

outgoing:
  request_timeout: 10
